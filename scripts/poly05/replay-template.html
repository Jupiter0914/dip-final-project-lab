
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>完整蒙版 · 已保存实验结果回放</title>
<style>
:root{--ink:#223638;--muted:#506163;--line:#c9d3cf;--green:#176c60;--warm:#fbfaf6;--fp:#be521f;--fn:#257b9e}
*{box-sizing:border-box}body,button,select,input{font-family:"Times New Roman",SimSun,"宋体",serif;font-size:17px}body{margin:0;background:var(--warm);color:var(--ink);line-height:1.5}main{max-width:1130px;margin:auto;padding:32px clamp(14px,4vw,56px) 46px}h1,h2,h3,p,figure{margin:0}h1{font-size:clamp(27px,4vw,42px);font-weight:normal;line-height:1.25;margin:.25em 0}h2{font-size:22px;font-weight:normal}h3{font-size:18px;font-weight:normal}.kicker{color:var(--green);letter-spacing:.08em}.top{border-top:3px solid var(--green);padding-top:16px}.conditions,.note,.sub{color:var(--muted)}button,select{background:white;color:var(--ink);border:1px solid #9aa9a5;padding:.34em .68em;border-radius:3px}button{cursor:pointer}button:hover,button:focus,select:focus{border-color:var(--green)}button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:white}.choose,.controls,.key,nav{display:flex;align-items:center;flex-wrap:wrap;gap:9px 13px}.choose{padding:14px 0;border-block:1px solid var(--line);margin:19px 0 15px}.choose select{max-width:100%}.section{margin-top:22px}.summary{display:flex;gap:16px 40px;flex-wrap:wrap;padding:12px 0}.value{font-size:27px;line-height:1.22;color:var(--green)}.stat small{display:block;font-size:15px;color:var(--muted)}.key{font-size:15px;color:var(--muted);margin:10px 0}.key span::before{content:"";display:inline-block;width:.88em;height:.88em;margin-right:.3em;vertical-align:-.08em;background:var(--c)}.controls{justify-content:space-between;font-size:15px}.controlgroup{display:flex;gap:4px}.controlgroup button{font-size:15px}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}.pane{border-block:1px solid var(--line);background:white;padding:8px}.pane canvas{display:block;width:100%;height:clamp(150px,22vw,260px);object-fit:contain;image-rendering:pixelated;background:#faf9f4;margin:4px 0}.sub{font-size:14px;overflow-wrap:anywhere}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:6px 9px;border-bottom:1px solid #d8dfdc}th:first-child,td:first-child{text-align:left}thead{border-block:1.6px solid var(--ink)}th{font-weight:normal;color:var(--green)}td{white-space:nowrap}tr:last-child td{border-bottom:1.4px solid var(--ink)}a{color:#175c59;text-underline-offset:.14em}.note{font-size:15px;margin:8px 0}details{border-block:1px solid var(--line);padding:10px 0;margin:16px 0}summary{cursor:pointer;color:var(--green)}details img{display:block;max-width:min(100%,800px);margin:10px auto}nav{margin-top:12px}.source{overflow-wrap:anywhere}.region{padding:8px 12px;border-left:3px solid var(--green);background:#f0f4f0}noscript{color:#853a18}@media(max-width:650px){main{padding-top:18px}.panels{grid-template-columns:repeat(2,minmax(0,1fr))}.pane:first-child{grid-column:1/-1}.pane canvas{height:155px}.pane:first-child canvas{height:165px}.choose{gap:6px}.choose select{width:100%}.summary{gap:12px 25px}table{font-size:15px}.controls{gap:8px}}@media print{main{max-width:none;padding:0}button,select,nav{display:none}.panels{grid-template-columns:repeat(3,1fr)}.pane{break-inside:avoid}}
</style>
</head>
<body><main><header class="top"><p class="kicker">已保存实验结果回放</p><h1>完整蒙版的多边形近似</h1><p class="conditions">256 字节上限 · 100 ms 调用方实收 · 原尺寸 PM31 解码</p></header>
<div class="choose"><label for="case">案例</label><select id="case"></select><button id="prev" type="button">上一个</button><button id="next" type="button">下一个</button></div>
<noscript>请启用浏览器内置 JavaScript 来切换本地案例。</noscript>
<article aria-live="polite"><h2 class="source" id="identity"></h2><p id="reason"></p><div class="summary"><div class="stat"><span class="value" id="average"></span><small>同源配对平均少错（像素）</small></div><div class="stat"><span class="value" id="delta"></span><small>所示这一次少错（像素）</small></div><div class="stat"><span class="value" id="session"></span><small>实际会话／重复</small></div></div><p id="region" class="region" hidden></p>
<div class="section controls"><div class="controlgroup" aria-label="评价区域"><button data-view="full" aria-pressed="true">完整画布</button><button data-view="crop" aria-pressed="false">相同局部放大</button></div><div class="controlgroup" aria-label="像素着色"><button data-mode="errors" aria-pressed="true">叠加错分</button><button data-mode="mask" aria-pressed="false">二值解码</button></div></div>
<div class="key" id="legend"><span style="--c:#374447" id="hit">正确前景</span><span style="--c:#be521f" class="error-key">多填 FP</span><span style="--c:#257b9e" class="error-key">漏填 FN</span></div>
<div class="panels"><figure class="pane"><h3>原始完整蒙版</h3><canvas id="p0" aria-label="原始蒙版"></canvas><figcaption id="s0" class="sub"></figcaption></figure><figure class="pane"><h3>增强圈内基线</h3><canvas id="p1" aria-label="增强圈内基线解码"></canvas><figcaption id="s1" class="sub"></figcaption></figure><figure class="pane"><h3>允许跨圈</h3><canvas id="p2" aria-label="允许跨圈解码"></canvas><figcaption id="s2" class="sub"></figcaption></figure></div>
<section class="section"><h2>已交付文件与时钟</h2><div class="scroll"><table><thead><tr><th>实测量</th><th>增强圈内基线</th><th>允许跨圈</th></tr></thead><tbody id="metrics"></tbody></table></div><p class="note">计时从内存中的二值数组开始。每种方法选取接收器在 100 ms 内收到的最后一个合格文件。表中另列其后发生的搜索结束和函数返回；当前页面的读取与绘制在实验之后。</p><nav id="files" aria-label="原文件"></nav></section>
<details id="action" hidden><summary>查看这个源的真实跨圈动作</summary><img src="../../../results/poly05/figures/02-exchange.png" alt="同一跨圈轨迹第 0 到第 1 轮的供体和接收圈局部"><p id="step"></p><nav id="action-files"></nav></details>
<p class="note"><a href="../manuscript_materials.html">中文报告素材</a> · <a href="index.json">案例、裁片、哈希与原始时钟</a></p></article></main>
<script type="application/json" id="saved">__SAVED_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("saved").textContent), cases=data.cases;
const el=id=>document.getElementById(id), sel=el("case");
const methods=["within_full","cross"], signs=v=>v>0?"+"+Number(v.toFixed(3)):Number(v.toFixed(3)).toString();
let current=0,view="full",mode="errors",generation=0;
for(const ds of ["Oxford","LEMS"]){const group=document.createElement("optgroup");group.label=ds;
cases.forEach((c,i)=>{if(c.dataset===ds){const o=document.createElement("option");o.value=i;o.textContent=c.title+" · "+c.id;group.append(o);}});sel.append(group);}
function link(parent,label,path){const a=document.createElement("a");a.href=path;a.download=path.split("/").at(-1);a.textContent=label;parent.append(a);}
function draw(){
 const c=cases[current],token=++generation;document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===view));document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
 document.querySelectorAll(".error-key").forEach(s=>s.hidden=mode==="mask");el("hit").textContent=mode==="mask"?"前景":"正确前景";
 const rect=view==="full"?[0,0,c.width,c.height]:[c.crop[0],c.crop[1],c.crop[2],c.crop[2]];
 [c.raw,...methods.map(m=>c.methods[m][mode])].forEach((path,i)=>{const canvas=el("p"+i);delete canvas.dataset.drawn;canvas.width=rect[2];canvas.height=rect[3];const img=new Image();
 img.onload=()=>{if(token!==generation)return;const ctx=canvas.getContext("2d");ctx.imageSmoothingEnabled=false;ctx.drawImage(img,...rect,0,0,rect[2],rect[3]);canvas.dataset.drawn=path;};
 img.onerror=()=>{if(token===generation)el("s"+i).textContent="图片加载失败　"+path;};img.src=path;});
 el("s0").textContent=view==="full"?c.width+" × "+c.height+" 像素":"左上 ("+rect[0]+", "+rect[1]+") · "+rect[2]+" × "+rect[3]+" 像素";
 methods.forEach((m,i)=>{const r=c.methods[m];el("s"+(i+1)).textContent="各圈顶点数　"+r.ring_points.join(" / ");});
}
function show(i){
 current=i;sel.value=String(i);const c=cases[i],m=c.methods;
 el("identity").textContent=c.dataset+" · "+c.id;el("reason").textContent=c.why+(c.reason==="typical_positive"&&c.repeat_delta===0?" 这个源平均有改善，所示重复恰好持平。":"");
 el("average").textContent=signs(c.source_mean);el("delta").textContent=signs(c.repeat_delta);el("session").textContent=c.session+" / "+c.rep;
 el("region").hidden=!c.region;if(c.region){const s=c.region;el("region").textContent=(s.kind==="hole"?"有限孔 ":"前景部件 ")+s.reference_id+"　原面积 "+s.reference_area+" 像素，增强圈内／跨圈解码面积 "+s.within_area+" / "+s.cross_area+" 像素，参考覆盖率 "+(100*s.within_recall).toFixed(2)+"% / "+(100*s.cross_recall).toFixed(2)+"%。";}
 const list=[["实际文件（B）","size"],["选中轮次","round"],["多填 FP（像素）","fp"],["漏填 FN（像素）","fn"],["总错分（像素）","xor"],["IoU","iou",6],["序列化完成（ms）","serialized_ms",4],["调用方实际接收（ms）","delivered_ms",4],["内部搜索结束（ms）","search_end_ms",4],["完整函数返回（ms）","end_ms",4]];
 const body=el("metrics");body.replaceChildren();for(const [label,k,digits] of list){const row=body.insertRow();row.insertCell().textContent=label;for(const method of methods){const v=m[method][k];row.insertCell().textContent=digits===undefined?v:v.toFixed(digits);}}
 const files=el("files");files.replaceChildren();link(files,"原始标注",c.source_file);link(files,"圈内 PM31",m.within_full.pm31);link(files,"跨圈 PM31",m.cross.pm31);
 const a=data.action;el("action").hidden=a.id!==c.id;el("action").open=false;
 if(c.id===a.id){el("step").textContent="供体环 "+a.donor+" 转给接收环 "+a.receiver+" 一个顶点；同一条轨迹少错 "+(a.before.xor-a.after.xor)+" 像素。上方跨方法差取自圈内与跨圈各自在截止前的文件。";const nav=el("action-files");nav.replaceChildren();link(nav,"动作前 PM31","evidence/"+a.before.sha256+".pm3");link(nav,"动作后 PM31","evidence/"+a.after.sha256+".pm3");}draw();
}
sel.onchange=()=>show(Number(sel.value));
function move(d){const a=Array.from(sel.options),p=a.findIndex(o=>Number(o.value)===current);show(Number(a[(p+d+a.length)%a.length].value));}
el("prev").onclick=()=>move(-1);el("next").onclick=()=>move(1);
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;draw();});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw();});
show(0);
</script></body></html>
