<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>轮廓编码实验台 · POLY02</title>
<style>
:root{color-scheme:light;--ink:#21352f;--muted:#52655b;--line:#cbd4c9;--paper:#f8f8f1;--teal:#126544}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Microsoft YaHei",system-ui,sans-serif}main{max-width:1270px;margin:auto;padding:25px 4vw 46px}header{border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline}h1{font-size:clamp(24px,3vw,36px);letter-spacing:-.04em;margin:0 0 12px}h2{font-size:20px;margin:22px 0 8px}p{margin:6px 0 13px;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;margin:17px 0}.toolbar label{display:flex;align-items:center;gap:7px}select,button,.file{font:inherit;border:1px solid #8e9e90;border-radius:4px;background:white;color:var(--ink);padding:4px 9px}button,.file,tbody tr{cursor:pointer}button:hover,.file:hover{background:#e5eee3}.file input{display:none}.panels,.moves{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr))}figure{margin:0;min-width:0}figcaption{font-size:14px;font-weight:650;padding:5px 0}.panels img,.moves img{width:100%;height:clamp(130px,17vw,208px);object-fit:contain;border:1px solid var(--line);background:#f9f8f3;image-rendering:pixelated}.legend{font-size:13px}.chip{display:inline-block;width:.85em;height:.85em;margin:0 4px 0 12px}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}th,td{text-align:right;border-bottom:1px solid var(--line);padding:6px 9px;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:550}tr.selected{background:#dcebdc;color:#103c2c}tbody tr:focus{outline:2px solid var(--teal)}.moves{grid-template-columns:1fr 1fr 1.35fr}.move-note{padding:8px 14px;border-left:2px solid var(--teal)}.move-note strong{display:block;font-size:18px}.move-note p{margin:6px 0}.download{background:var(--teal);color:white;border-color:var(--teal)}.download:hover{background:#204d37}.status{font-size:13px;color:var(--muted)}@media(max-width:760px){.panels{grid-template-columns:1fr 1fr}.moves{grid-template-columns:1fr 1fr}.move-note{grid-column:span 2}.status{font-size:11px}main{padding:14px}}
</style><main><header><h1>轮廓编码实验台</h1><span id="mode" class="status"></span></header>
<div class="toolbar"><label>输入 <select id="source"></select></label><label>顶点数 K <select id="budget"></select></label><label class="file" id="fileLabel">打开二值 PNG<input id="file" type="file" accept="image/png"></label><button class="download" id="save">保存当前 POL1</button><span id="status" role="status"></span></div>
<section class="panels"><figure><figcaption>原始二值前景</figcaption><img id="raw" alt="原始二值前景"></figure><figure><figcaption>评价使用的最大外圈</figcaption><img id="target" alt="填孔后的外轮廓"></figure><figure><figcaption id="vertexCaption">实际整数顶点</figcaption><img id="vertices" alt="从 POL1 字节读取的顶点"></figure><figure><figcaption>解码误差</figcaption><img id="error" alt="多填和漏填像素"></figure></section>
<p class="legend"><i class="chip" style="background:#3d4c4f"></i>重合前景<i class="chip" style="background:#d15c2c"></i>多填 FP<i class="chip" style="background:#2285a6"></i>漏填 FN　四幅图按相同的前景范围放大，指标按原尺寸全图计算。</p>
<h2>同一输入的编码结果</h2><p>选择一行查看实际顶点与回填误差。字节数只计 POL1。耗时来自这次完整编码，包含初始化与后处理。BF₁、BF₂、BF₃ 分别是 1、2、3 像素容差下的边界 F 分数，越大越好。</p>
<div class="table"><table><thead><tr><th>方法</th><th>字节</th><th>IoU</th><th>错分</th><th>FP</th><th>FN</th><th>BF₁</th><th>BF₂</th><th>BF₃</th><th>编码 ms</th></tr></thead><tbody id="tbody"></tbody></table></div>
<h2>一次真实的顶点试探</h2><div class="toolbar"><label>几何起点的边界保护 <select id="move"></select></label></div>
<section class="moves"><figure><figcaption>移动前 · 同坐标放大</figcaption><img id="m0" alt="移动前局部"></figure><figure><figcaption>候选移动 · 同坐标放大</figcaption><img id="m1" alt="候选移动局部"></figure><div id="explain" class="move-note"></div></section>
</main><script>
const D=/*DATA*/null; const $=s=>document.getElementById(s);
const labels={geometry:'几何细调',local_iou:'局部 IoU',sm_iou:'SM 逐点删除',raster:'v1 直接 XOR',post_xor:'几何后继续 XOR',post_guard:'几何后继续 XOR + 边界保护'};
let active='post_guard', current,upload=null,rev=0;
function option(s,v,t){const o=new Option(t,v);$(s).add(o)}
for(const id of D.ids)option('source',id,id);for(const k of (D.offline?[16,32]:[8,12,16,24,32,48]))option('budget',k,k);
$('source').value=D.initial;$('budget').value=D.k;$('mode').textContent=D.offline?'POLY02 / 已实测的离线样例':'POLY02 / 本机实时计算';
if(D.offline)$('fileLabel').style.display='none';
function cell(tr,s){const c=tr.insertCell();c.textContent=s}
function draw(){if(!current)return;const m=current.methods[active];$('raw').src=current.input;$('target').src=current.target;$('vertices').src=m.vertex_image;$('error').src=m.error_image;$('vertexCaption').textContent=labels[active]+' · '+current.k+' 点';$('tbody').replaceChildren();
for(const [key,o] of Object.entries(current.methods)){const s=o.scores,tr=$('tbody').insertRow();tr.className=key===active?'selected':'';tr.tabIndex=0;tr.onclick=()=>{active=key;draw()};tr.onkeydown=e=>{if(e.key==='Enter')tr.click()};for(const x of [labels[key],s.bytes,s.iou.toFixed(5),s.xor,s.fp,s.fn,s.bf1.toFixed(4),s.bf2.toFixed(4),s.bf3.toFixed(4),s.encode_ms.toFixed(2)])cell(tr,x)}}
function drawMove(){if(!current)return;const m=current.moves[Number($('move').value||0)],el=$('explain');el.replaceChildren();
for(const id of ['m0','m1'])$(id).style.visibility=m?'visible':'hidden';if(!m){el.textContent='本次搜索没有产生合法、严格降低错分的候选移动。';return}
$('m0').src=m.before_image;$('m1').src=m.after_image;const title=document.createElement('strong');title.textContent=m.accepted?'接受这个位置':'拒绝这个位置';el.append(title);
for(const txt of ['第 '+m.sweep+' 次扫描 · 第 '+m.vertex+' 个顶点，('+m.old+') → ('+m.new+')','错分 '+m.before.xor+' → '+m.after.xor+' 像素','BF₂ '+m.before.bf2.toFixed(6)+' → '+m.after.bf2.toFixed(6)+'；初始下限 '+m.floor.toFixed(6),m.accepted?'错分严格减少，候选仍达到初始边界下限。':'虽然错分减少，候选低于初始边界下限，因此保留原位置。']){const p=document.createElement('p');p.textContent=txt;el.append(p)}}
async function refresh(){const ticket=++rev;const k=Number($('budget').value);$('status').textContent='计算中…';try{let v;
if(D.offline){v=D.examples[String(k)]}else{const u='/run?k='+k+'&id='+encodeURIComponent($('source').value);const r=await fetch(u,upload?{method:'POST',body:upload}:{method:'GET'});if(!r.ok)throw Error(await r.text());v=await r.json()}
if(ticket!==rev)return;current=v;$('status').textContent=v.id+' · '+v.w+' × '+v.h;$('move').replaceChildren();v.moves.forEach((m,i)=>option('move',i,m.accepted?'已接受的移动':'因边界下限被拒绝的移动'));draw();drawMove()}catch(e){if(ticket===rev)$('status').textContent=e.message}}
$('source').onchange=()=>{upload=null;$('file').value='';refresh()};$('budget').onchange=refresh;$('move').onchange=drawMove;$('file').onchange=()=>{upload=$('file').files[0];if(upload)refresh()};
$('save').onclick=()=>{if(!current)return;const bytes=Uint8Array.from(atob(current.methods[active].polygon),c=>c.charCodeAt(0));const u=URL.createObjectURL(new Blob([bytes]));const a=document.createElement('a');a.href=u;a.download=current.id+'-'+current.k+'-'+active+'.poly';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};refresh();
</script></html>
